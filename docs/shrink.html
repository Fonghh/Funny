<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050709">
<title>壓縮影片</title>
<style>
/* Shrinks a long phone video (re-encodes it at 640 px, about 1.5 Mbps) and splits it into parts small enough to attach in the
   Claude app (30 MB each). Runs entirely on the phone: the video plays into a canvas that MediaRecorder records. */
:root {
  --bg: #050709; --panel: #0b1014; --panel-2: #10171c; --line: #1c272e; --line-hi: #2b3a43;
  --ink: #e8f0f2; --muted: #7d8f97; --cyan: #3fd4ff; --ball: #f3d23c; --good: #44e0a0; --bad: #ff5d6c;
  --display: "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", -apple-system, "PingFang TC", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
.app { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; padding: 10px max(14px, env(safe-area-inset-left, 0px)) 40px; }
.bar { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.bar b { font-family: var(--display); font-size: 17px; letter-spacing: .06em; margin-right: auto; }
.bar a { color: var(--ball); text-decoration: none; font-size: 14px; }
.card { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.card h1 { margin: 0; font-size: 18px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-hi); background: var(--panel-2); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--ball); border-color: var(--ball); color: var(--bg); box-shadow: 0 0 14px rgba(243, 210, 60, .35); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
video { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 6px; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--ball); }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status.err { color: var(--bad); }
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.parts li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line-hi); border-radius: 8px; }
.parts li span { font-family: var(--mono); font-size: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app">
  <header class="bar"><b>壓縮影片</b><a href="score.html?v=20261028113956">← 即時計分</a><a href="./?v=20261028113956">賽後分析</a></header>

  <section class="card">
    <h1>把影片變小，傳給 Claude</h1>
    <p>選一段相簿裡的影片，手機會把它轉成 640 寬的小檔（每分鐘約 11MB），超過 24MB 會自動分成好幾段，每段都能直接附在 Claude App 的訊息裡。</p>
    <p>轉檔時間大約等於影片長度（3 分鐘的影片要 3 分鐘）。轉的時候<b>不要切換 App 或鎖定螢幕</b>，不然會停住。</p>
    <div class="row">
      <label class="btn primary" for="file">選擇影片</label>
      <input type="file" id="file" accept="video/*">
      <button class="btn" id="stopBtn" type="button" hidden>停止</button>
    </div>
  </section>

  <section class="card" id="work" hidden>
    <video id="vid" playsinline muted></video>
    <div class="prog"><i id="bar"></i></div>
    <div class="status" id="status" role="status"></div>
    <ul class="parts" id="parts"></ul>
    <div class="row"><button class="btn primary" id="shareAll" type="button" hidden>全部存起來／分享</button></div>
    <p id="after" hidden>存到相簿或「檔案」後，在 Claude App 按 ＋ 選影片附上就可以了。一次訊息可以附好幾段。</p>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const vid = $("vid"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
// ?limitmb= sets a smaller part size for testing
const LIMIT = (+new URLSearchParams(location.search).get("limitmb") || 24) * 1048576, BITRATE = 1.5e6, LONG_SIDE = 640;
let parts = [], rec = null, chunks = [], size = 0, partStart = 0, running = false, wakeLock = null, baseName = "video", finishing = null;
function setStatus(msg, err = false) { $("status").textContent = msg; $("status").classList.toggle("err", err); }
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const mb = (n) => (n / 1048576).toFixed(1) + "MB";
function pickMime() {
  for (const m of ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp8", "video/webm"]) if (window.MediaRecorder?.isTypeSupported?.(m)) return m;
  return "";
}
const mime = pickMime(), ext = mime.includes("mp4") ? "mp4" : "webm";

// one part per recorder; a new recorder takes over as soon as the current part reaches the size limit
function startPart(stream) {
  const r = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: BITRATE }), mine = [];
  const from = vid.currentTime;
  let bytes = 0, rolled = false;
  r.ondataavailable = (e) => {
    if (!e.data.size) return;
    mine.push(e.data); bytes += e.data.size;
    if (r === rec) { size = bytes; showProgress(); }
    if (!rolled && r === rec && bytes > LIMIT && running) { rolled = true; rec = startPart(stream); r.stop(); }
  };
  r.onstop = () => { addPart(new Blob(mine, { type: mime.split(";")[0] }), from, vid.currentTime); };
  r.start(1000);
  return r;
}
function addPart(blob, from, to) {
  const n = parts.length + 1, name = `${baseName}-${String(n).padStart(2, "0")}.${ext}`;
  parts.push({ file: new File([blob], name, { type: blob.type }), from, to });
  parts.sort((a, b) => a.from - b.from);
  renderParts();
  if (finishing && parts.length === finishing.expect) finishing.done();
}
function renderParts() {
  $("parts").innerHTML = parts.map((p, i) => `<li><span>第 ${i + 1} 段 · ${fmt(p.from)}–${fmt(p.to)} · ${mb(p.file.size)}</span><button class="btn" type="button" data-i="${i}">存／分享</button></li>`).join("");
  $("parts").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => share([parts[+b.dataset.i].file])));
}
async function share(files) {
  if (navigator.canShare?.({ files })) {
    try { await navigator.share({ files }); } catch (e) { if (e.name !== "AbortError") setStatus(`分享失敗：${e.message}`, true); }
    return;
  }
  for (const f of files) { const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); }
}
function showProgress() {
  const d = vid.duration;
  if (isFinite(d) && d > 0) $("bar").style.width = `${Math.min(100, 100 * vid.currentTime / d)}%`;
  setStatus(`轉檔中 ${fmt(vid.currentTime)}${isFinite(d) ? " / " + fmt(d) : ""} · 第 ${parts.length + 1} 段 ${mb(size)}`);
}
// a video that has not been played yet may not report its size or length on iPhones
function ready(v) {
  return new Promise((res) => {
    if (v.readyState >= 1 && v.videoWidth) return res();
    const t = setTimeout(res, 5000);
    v.addEventListener("loadedmetadata", () => { clearTimeout(t); res(); }, { once: true });
  });
}
function draw() {
  if (!running) return;
  ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
  // original time in the corner, so a moment in a part can be found in the full video
  ctx.font = "11px monospace"; ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, 58, 15);
  ctx.fillStyle = "#fff"; ctx.fillText(vid.currentTime.toFixed(1) + "s", 3, 11);
  if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(draw); else requestAnimationFrame(draw);
}
$("file").addEventListener("change", async () => {
  const f = $("file").files[0]; if (!f) return;
  if (!mime || !canvas.captureStream) { $("work").hidden = false; setStatus("這個瀏覽器不能錄影，沒辦法壓縮。請用 iPhone 的 Safari 開這個網頁。", true); return; }
  baseName = f.name.replace(/\.[^.]+$/, "").replace(/[^\w-]+/g, "_") || "video";
  parts = []; renderParts(); $("shareAll").hidden = true; $("after").hidden = true; $("bar").style.width = "0";
  $("work").hidden = false;
  vid.src = URL.createObjectURL(f);
  await ready(vid);
  if (!vid.videoWidth) { setStatus("讀不到這段影片，請換一段。", true); return; }
  const s = LONG_SIDE / Math.max(vid.videoWidth, vid.videoHeight);
  canvas.width = Math.round(vid.videoWidth * s / 2) * 2; canvas.height = Math.round(vid.videoHeight * s / 2) * 2;
  const stream = canvas.captureStream(30);
  running = true; size = 0; finishing = null;
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  try { await vid.play(); } catch (e) { running = false; setStatus("影片無法播放，請換一段。", true); return; }
  draw();
  rec = startPart(stream);
  $("stopBtn").hidden = false; $("file").disabled = true;
  vid.ontimeupdate = showProgress;
  vid.onended = () => finish();
});
async function finish() {
  if (!running) return;
  running = false; vid.pause();
  const expect = parts.length + 1;
  await new Promise((res) => { finishing = { expect, done: res }; rec.stop(); setTimeout(res, 5000); });
  rec = null; wakeLock?.release?.(); wakeLock = null;
  $("stopBtn").hidden = true; $("file").disabled = false; $("bar").style.width = "100%";
  const total = parts.reduce((a, p) => a + p.file.size, 0);
  setStatus(`完成：${parts.length} 段，共 ${mb(total)}。`);
  $("shareAll").hidden = !parts.length; $("after").hidden = !parts.length;
}
$("stopBtn").addEventListener("click", finish);
$("shareAll").addEventListener("click", () => share(parts.map((p) => p.file)));
document.addEventListener("visibilitychange", () => {
  if (!running) return;
  if (document.hidden) setStatus("切到別的 App 時轉檔會停住，請回到這個畫面。", true);
  else vid.play().catch(() => {});      // Safari pauses the video in the background
});
</script>
</body>
</html>
